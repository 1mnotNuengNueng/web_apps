<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            width: 320px;
            background-color: rgb(173, 40, 210);
            text-align: center;
            border-radius: 24px;
            padding: 35px 25px 25px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            color: white;
        }

        .card img {
            width: 180px;
            height: 180px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .card .title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 20px;
        }



        .card .contact {
            background-color: rgb(255, 255, 255);
            color: rgb(50, 50, 50);
            padding: 12px 0;
            width: 90%;
            margin: 33px auto 10px auto;
            display: block;
            border-radius: 6px;
            font-weight: 500;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="../assignment_2/img/Jobs_hero.webp">
        <h1>Steve Jobs</h1>
        <p class="title">New York, USA</p>
        <p>Businessperson co-founded Apple Inc</p>
        <p class="contact">Message</p>
    </div>
</body>

</html>
