<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card {
            margin: 25%;
            padding: 20px;
            display: block;
            background-color: green;
            
        }
        label {
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
            color: rgb(255, 255, 255);
        }
        input[type="text"], 
        textarea {
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.7);
            background: transparent;
            outline: none;
            color: white;
            padding: 8px 0;
            width: 100%;
            font-size: 16px;
            transition: border-bottom 0.3s ease;
        }
        .container {
            padding: 5px
        }
        .card input[type="submit"] {
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="margin: 10px; text-align: center;">Contact us</h1>
        <div>
            <input type="radio" name="topic" id="hi"> 
            <label for="hi" style="margin:0 10px 0 5px; font-weight:normal;">Say Hi</label>
            <input type="radio"name="topic" id="quote">
            <label for="hi" style="margin:0 10px 0 5px; font-weight:normal;">Get a Quote</label>
        </div>
        
        
        <br>
        <div class="container">
           <label>Your name</label>
            <input type="text">
        </div>
        
        <div class="container">
           <label>Your Email</label>
            <input type="text">
        </div>
        
        <div class="container">
           <label>Your Message</label>
            <textarea></textarea>
        </div>


        <input type="submit" value="Submit">
    </div>
    
</body>
</html>
