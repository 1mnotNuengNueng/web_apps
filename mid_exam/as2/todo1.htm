<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card {
            border: 1px solid black;
            width: 350px;
            text-align: center;
            margin: 50px auto;
            align-content: center;
            display: block;
            align-content: center;
            height: 500px;
        }

        .title {
            font-size: 16px;
            color: blueviolet;
        }

        .card h1 {
            font-size: 32px;
            font-weight: bold;
        }

        .card .contact {
            background-color: aqua;
            color: brown;
            font-size: 24px;
            border: 1px solid black;
            padding: 5px;
            width: 90%;
            text-align: center;
            margin: 15px auto 15px auto;
            border-radius: 10px;
        }

        .card img {
            width: 180px;
            height: 180px;
            display: block;
            background-color: blueviolet;
            border: 2px white solid;
            border-radius: 50%;
            object-fit: cover;
            margin: 10px auto;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="img/Jobs_hero.webp" alt="">
        <h1>Rachawadee</h1>
        <p class="title">Student</p>
        <p>K.U.</p>
        <p class="contact">Contact</p>
    </div>

</body>

</html>
