<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REgister form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            height: 700px;
            width: 400px;
            background-color: aliceblue;
            border: none;
            display: flex;
            flex-direction: column;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;

        }

        .card h1 {
            font-size: 20px;
            font-weight: 800;
            padding: 5px;
        }

        .card p {
            font-size: 12px;
            color: gray;
            padding: 5px;
        }

        .info-group {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .item-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 10px;
            flex: 1;
        }

        .card-topic {
            font-size: 15px;
            font-weight: 800;
        }

        .text-input {
            padding: 10px;
            border: 1px solid gray;
            border-radius: 2px;
            width: 100%;
        }

        .checkbox {
            margin-left: 10px;
            accent-color: orange;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Register</h1>
        <p> Please fill in the form below to register.</p>

        <form action="#" method="POST">
            <div class="info-group">
                <div class="item-group">
                    <label for="first_name" class="card-topic">Name</label>
                    <input type="text" class="text-input">
                </div>
                <div class="item-group">
                    <label for="last_name" class="card-topic">Last name</label>
                    <input type="text" class="text-input">
                </div>
            </div>
            <div class="info-group">
                <div class="item-group">
                    <p class="card-topic">Email Address</p>
                    <input type="text" class="text-input">
                </div>
            </div>
            <div class="info-group">
                <input type="checkbox" class="checkbox">
                <p>Correct contact info</p>
                <p></p>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>

</html>
