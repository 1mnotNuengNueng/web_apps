<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: aqua;
        }

        .cal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 700px;
            width: 500px;
            border: 1px solid black;
            margin: 50px auto;
            background-color: blueviolet;
        }

        .cal-container h1 {
            padding: 10px;
            font-size: 32px;
            font-weight: bold;
            border: 1px solid black;
            width: fit-content;
            text-align: center;
            border-radius: 10px;
        }

        .cal-screen {
            height: 100px;
            width: 450px;
            border: 1px solid black;
            background-color: aliceblue;
            text-align: right;
            font-size: 24px;
            padding-right: 10px;
        }

        .cal-btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /*grid-template-rows: repeat(5, 1fr);*/
            gap: 20px;
            width: 90%;
            flex: 1;
            margin-top: 10px;
        }

        .cal-btn-eq {
            grid-column: span 2;

        }

        button {
            padding: 10px;
            font-size: 24px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: aliceblue;
        }
    </style>
</head>

<body>

    <div class="cal-container">
        <h1>Calculator</h1>
        <input type="text" placeholder="1+1" class="cal-screen" readonly>
        <div class="cal-btns">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>.</button>
            <button>+</button>
            <button>-</button>
            <button>*</button>
            <button>/</button>
            <button>C</button>
            <button class="cal-btn-eq">=</button>
        </div>
    </div>


</body>

</html>
