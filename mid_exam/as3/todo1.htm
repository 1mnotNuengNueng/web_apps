<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            margin: 100px auto;
            border: 2px solid black;
            width: 400px;
            height: 600px;
            border-radius: 20px;
            background-color: chartreuse;
            overflow: hidden;
        }

        .chat-head {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid black;
            background-color: bisque;
        }

        .chat-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow-y: auto;
        }

        .chat-sender {
            display: flex;
            background-color: white;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            align-self: flex-end;
            width: fit-content;
        }

        .chat-receiver {
            display: flex;
            background-color: white;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            align-self: flex-start;
            width: fit-content;
        }

        .chat-footer {
            display: flex;
            padding: 10px;
            border-top: 1px solid black;
            background-color: bisque;
            width: 100%;
            align-items: center;
            justify-content: center;
        }

        .chat-footer input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid black;
        }

        .chat-footer button {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid black;
            background-color: bisque;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-head">
            Chat
        </div>
        <div class="chat-body">
            <div class="chat-sender">
                <p>hello</p>
            </div>
            <div class="chat-receiver">
                <p>hello</p>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" placeholder="Type a message...">
            <button>Send</button>
        </div>
    </div>

</body>

</html>
