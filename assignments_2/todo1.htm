<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card {
            width: 300px;
            margin: 50px auto;
            box-shadow: 0 4px 8px rgb(63, 63, 63);
            text-align: center;
            background-color: aliceblue;
        }

        .card h1 {
            padding: 10px;
        }

        .card img {
            width: 100%;
            display: block;
            margin-bottom: 10px;
            background-color: black;
        }

        .card .title {
            color: lightslategrey;
            font-size: 20px;
            margin: 10px;
            padding: 10px;
        }

        .card .contact {
            background-color: black;
            color: aliceblue;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid black;
            border-radius: 50px;
            display: inline-block;
        }
    </style>

</head>

<body>
    <div class="card">
        <img src="./img/profile.png">
        <h1>Thanakorn Saelim</h1>
        <p class="title">Student</p>
        <p>Kasetsart University</p>
        <p class="contact">Contact</p>
    </div>

</body>

</html>
