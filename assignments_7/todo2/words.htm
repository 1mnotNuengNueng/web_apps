<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vocabulary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .container {
            background-color: #a4f44c;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .input-group {
            background-color: white;
            padding: 15px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
        }
        .input-group input {
            border: none;
            outline: none;
            font-size: 16px;
            flex-grow: 1;
        }
        .input-group button {
            background-color: #ddd;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        .word-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .word-item {
            background-color: #ffeb00;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #aaa;
            font-weight: bold;
        }
        .word-item:last-child {
            border-bottom: none;
            border-radius: 0 0 10px 10px;
        }
        .delete-btn {
            color: red;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }
        .nav-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4a6c8a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="input-group">
            <input type="text" id="wordInput" placeholder="Enter your word" onkeypress="handleKeyPress(event)">
            <button onclick="addWord()">Add</button>
        </div>
        <ul class="word-list" id="wordList">
            <!-- Words will be injected here -->
        </ul>
    </div>

    <a href="game.htm" class="nav-btn">Play Game -></a>

    <script>
        let vocabList = JSON.parse(localStorage.getItem('vocabList')) || ['cat', 'dog', 'act', 'bat', 'rat'];

        function renderList() {
            const listEl = document.getElementById('wordList');
            listEl.innerHTML = '';
            vocabList.forEach((word, index) => {
                const li = document.createElement('li');
                li.className = 'word-item';
                li.innerHTML = `
                    <span>${word}</span>
                    <span class="delete-btn" onclick="deleteWord(${index})">🗑️</span>
                `;
                listEl.appendChild(li);
            });
            localStorage.setItem('vocabList', JSON.stringify(vocabList));
        }

        function addWord() {
            const input = document.getElementById('wordInput');
            const word = input.value.trim().toLowerCase();
            if (word && !vocabList.includes(word)) {
                vocabList.push(word);
                input.value = '';
                renderList();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addWord();
        }

        function deleteWord(index) {
            vocabList.splice(index, 1);
            renderList();
        }

        // Initial render
        renderList();
    </script>
</body>
</html>
