<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>showvote</title>
</head>
<body>
    <div class="container">
        <h1>showvote</h1>
        <div class="options" style="display: flex;">
            <div class="option">Hamburger</div>
            <div class="vote-count" id="count-burger">0</div>
        </div>
        <div class="options" style="display: flex;">
            <div class="option">Pizza</div>
            <div class="vote-count" id="count-pizza">0</div>
        </div>
        <div class="options" style="display: flex;">
            <div class="option">Hotdog</div>
            <div class="vote-count" id="count-hotdog">0</div>
        </div>
    </div>

    <div class="vote-box">
        <a href="#" onclick="goToVote()" class="btn">Back to vote</a>
        <button class="btn" onclick="clearVotes()">Clear Vote</button>    
    </div>

    <script>
        let urlParams = new URLSearchParams(window.location.search);
        ['burger','pizza','hotdog'].forEach(item => {
            let val = urlParams.get(item);
            if(val !== null) localStorage.setItem('vote_' + item, val);
        });

        function getVote(item){
            return parseInt(localStorage.getItem('vote_' + item) || 0);
        }

        function updateDisplay(){
            document.getElementById('count-burger').innerText = getVote('burger');
            document.getElementById('count-pizza').innerText = getVote('pizza');
            document.getElementById('count-hotdog').innerText = getVote('hotdog');
        }

        function clearVotes(){
            localStorage.setItem('vote_burger', 0);
            localStorage.setItem('vote_pizza', 0);
            localStorage.setItem('vote_hotdog', 0);
            updateDisplay();
        }
        
        function goToVote(){
            let b = getVote('burger');
            let p = getVote('pizza');
            let h = getVote('hotdog');
            window.location.href = `vote.htm?burger=${b}&pizza=${p}&hotdog=${h}`;
        }

        window.onload = updateDisplay;
        
    </script>
    
</body>
</html>
